name: CI

# push 只在 main 上触发；功能分支由 pull_request 检查覆盖，避免同一提交重复运行两套 CI。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # 公开 CI 不配置任何真实 Gmail OAuth 凭据；测试全部使用本地模拟服务。
  KEEPRAWMAIL_GOOGLE_CLIENT_ID: ""
  KEEPRAWMAIL_GOOGLE_CLIENT_SECRET: ""

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test KeeprawMail.Core
        run: >
          dotnet test KeeprawMail.Core.Tests/KeeprawMail.Core.Tests.csproj -c Release
          --logger "trx;LogFileName=core-linux.trx" --logger "console;verbosity=normal"
          --results-directory TestResults
      - name: Sync request comparison (legacy vs incremental, measured)
        if: always()
        shell: bash
        run: |
          f=KeeprawMail.Core.Tests/bin/Release/net9.0/sync-request-comparison.txt
          if [ -f "$f" ]; then cat "$f"; mkdir -p TestResults; cp "$f" TestResults/; else echo "::error::comparison file missing"; exit 1; fi
      - name: Preview request counts (PR3, measured)
        if: always()
        shell: bash
        run: |
          f=KeeprawMail.Core.Tests/bin/Release/net9.0/preview-request-metrics.txt
          if [ -f "$f" ]; then cat "$f"; mkdir -p TestResults; cp "$f" TestResults/; else echo "::error::preview metrics file missing"; exit 1; fi
      - name: Repeat Tls_RevokedCertificate_Rejected 20x (Linux)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            dotnet test KeeprawMail.Core.Tests/KeeprawMail.Core.Tests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~TlsMailEndToEndTests.Tls_RevokedCertificate_Rejected" > repeat.log 2>&1 \
              || { cat repeat.log; echo "::error title=Revocation repeat::iteration $i failed"; exit 1; }
            grep -q "Passed:     1" repeat.log || { cat repeat.log; echo "::error::iteration $i did not run the test"; exit 1; }
          done
          echo "::notice title=Linux revocation repeat::Tls_RevokedCertificate_Rejected passed 20/20"
      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          [xml]$trx = Get-Content TestResults/core-linux.trx
          $c = $trx.TestRun.ResultSummary.Counters
          Write-Host "::notice title=Linux test results::total=$($c.total) passed=$($c.passed) failed=$($c.failed) notExecuted=$($c.notExecuted) (DPAPI test is skipped on Linux by design)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults/

  windows:
    name: Windows build, tests, Release/AOT publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Tool versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          dotnet --info > logs/dotnet-info.txt
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Tee-Object -FilePath logs/vs-cpp-tools.txt

      - name: Build KeeprawMail.Core
        shell: pwsh
        run: dotnet build KeeprawMail.Core/KeeprawMail.Core.csproj -c Release -warnaserror:IL2026,IL2046,IL2057,IL2067,IL2070,IL2072,IL2075,IL2087,IL2090,IL2091,IL3050,IL3051 2>&1 | Tee-Object -FilePath logs/core-build.log

      - name: Test KeeprawMail.Core (Windows, includes real DPAPI)
        shell: pwsh
        run: |
          dotnet test KeeprawMail.Core.Tests/KeeprawMail.Core.Tests.csproj -c Release `
            --logger "trx;LogFileName=core-windows.trx" --logger "console;verbosity=normal" `
            --results-directory TestResults 2>&1 | Tee-Object -FilePath logs/core-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify DPAPI test actually ran (not skipped)
        shell: pwsh
        run: |
          [xml]$trx = Get-Content TestResults/core-windows.trx
          $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }
          $r = Select-Xml -Xml $trx -Namespace $ns -XPath "//t:UnitTestResult[contains(@testName,'Dpapi_RoundTrip_OnWindows')]"
          if (-not $r) { Write-Error "DPAPI test not found in TRX"; exit 1 }
          $outcome = $r.Node.outcome
          Write-Host "DPAPI test outcome: $outcome"
          if ($outcome -ne "Passed") { Write-Error "DPAPI test outcome is '$outcome', expected Passed"; exit 1 }
          $counters = (Select-Xml -Xml $trx -Namespace $ns -XPath "//t:Counters").Node
          $summary = "Windows tests: total=$($counters.total) passed=$($counters.passed) failed=$($counters.failed) notExecuted=$($counters.notExecuted); DPAPI=$outcome"
          $summary | Tee-Object -FilePath logs/test-summary.txt
          Write-Host "::notice title=Windows test results::$summary"

      - name: Repeat Tls_RevokedCertificate_Rejected 20x (Windows)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            $out = dotnet test KeeprawMail.Core.Tests/KeeprawMail.Core.Tests.csproj -c Release --no-build `
              --filter "FullyQualifiedName~TlsMailEndToEndTests.Tls_RevokedCertificate_Rejected" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $out -notmatch "Passed:\s+1") { Write-Host $out; Write-Host "::error title=Revocation repeat::iteration $i failed"; exit 1 }
          }
          Write-Host "::notice title=Windows revocation repeat::Tls_RevokedCertificate_Rejected passed 20/20"

      - name: Publish WinUI app (Release, win-x64, Native AOT)
        shell: pwsh
        run: |
          dotnet publish KeeprawMail/KeeprawMail.csproj -c Release -r win-x64 -p:Platform=x64 `
            -p:PublishAot=true -p:WindowsAppSDKSelfContained=true `
            -o artifacts/KeeprawMail-win-x64 -bl:logs/publish.binlog 2>&1 | Tee-Object -FilePath logs/publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native AOT output
        shell: pwsh
        run: |
          $exe = "artifacts/KeeprawMail-win-x64/KeeprawMail.exe"
          if (-not (Test-Path $exe)) { Write-Error "KeeprawMail.exe not produced"; exit 1 }
          # Native AOT 产物不应包含托管的 KeeprawMail.dll
          if (Test-Path "artifacts/KeeprawMail-win-x64/KeeprawMail.dll") { Write-Error "Managed KeeprawMail.dll found: not a Native AOT publish"; exit 1 }
          $size = (Get-Item $exe).Length
          "KeeprawMail.exe size: $size bytes" | Tee-Object -FilePath logs/aot-output.txt
          Get-ChildItem artifacts/KeeprawMail-win-x64 | Select-Object Name, Length | Format-Table | Out-String | Tee-Object -FilePath logs/aot-output.txt -Append
          $warnings = @(Select-String -Path logs/publish.log -Pattern "warning IL\d{4}" | ForEach-Object { $_.Line } | Sort-Object -Unique)
          $warnings | Set-Content logs/aot-warnings.txt
          "AOT/trim warnings: $($warnings.Count)" | Tee-Object -FilePath logs/aot-output.txt -Append
          Write-Host "::notice title=Native AOT publish::KeeprawMail.exe $size bytes; IL/AOT warnings: $($warnings.Count)"
          # 裁剪/AOT 警告意味着运行时可能失败（例如反射 JSON），不允许带警告通过
          if ($warnings.Count -gt 0) { $warnings | ForEach-Object { $t = $_ -replace '\[.*?\]$',''; if ($t.Length -gt 900) { $t = $t.Substring(0,900) }; Write-Host "::warning title=IL warning::$t" }; Write-Error "Native AOT publish has IL warnings"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: |
            logs/
            TestResults/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KeeprawMail-win-x64-aot
          path: artifacts/KeeprawMail-win-x64/
